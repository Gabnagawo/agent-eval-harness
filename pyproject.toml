[project]
name = "agent-eval-harness"
version = "0.1.0"
description = "Evaluate tool-using AI agents on reproducible tasks: success, pass^k, tool-call correctness, efficiency, safety and cost."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabriel Nagawo" }]
keywords = ["llm", "agents", "evaluation", "tool-calling", "benchmark", "ollama", "testing", "qa"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "jmespath>=1.0",
    "jsonschema>=4.22",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]

[project.scripts]
agent-eval = "agent_eval.cli:app"

[project.urls]
Repository = "https://github.com/Gabnagawo/agent-eval-harness"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-jmespath>=1.0",
    "types-jsonschema>=4.22",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_eval"]

[tool.hatch.build.targets.wheel.force-include]
"tasks" = "agent_eval/_tasks"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs/results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PT", "RUF", "N", "PTH"]
# The formatter wraps code; the remaining long lines are prompt text and HTML.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--import-mode=importlib",
    "-m",
    "not live",
    "--cov=agent_eval",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=80",
]
markers = [
    "live: needs a running Ollama at OLLAMA_HOST (deselected by default)",
]

[tool.coverage.run]
branch = true
source = ["agent_eval"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["anthropic.*", "openai.*"]
ignore_missing_imports = true
